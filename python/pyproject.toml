[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cahier-numerique"
version = "1.0.0"
description = "Cahier de textes numérique — application locale PyQt6 pour enseignants"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Propriétaire" }
authors = [{ name = "Cahier de textes" }]
dependencies = [
    "PyQt6>=6.9,<7",
    "pydantic>=2.9,<3",
    "Babel>=2.14,<3",
    "platformdirs>=4.2,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]

[project.gui-scripts]
cahier = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "PTH", "A", "ARG", "PL"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0915", "ARG002"]

# Les tables de libellés et les tracés SVG sont des données : une entrée par
# ligne se lit mieux qu'un texte réparti sur plusieurs lignes.
[tool.ruff.lint.per-file-ignores]
"app/core/i18n.py" = ["E501"]
"app/ui/icons.py" = ["E501"]
"app/ui/pages/help.py" = ["E501"]
"run.py" = ["PLC0415"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
