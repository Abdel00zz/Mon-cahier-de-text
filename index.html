<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Mon Cahier de Text</title>
  <meta name="application-name" content="Mon Cahier de Text" />
  <meta name="description" content="Cahier de textes enseignant avec progression, emploi du temps, évaluations et accès hors connexion." />
  <meta property="og:title" content="Mon Cahier de Text" />
  <meta property="og:description" content="Cahier de textes enseignant avec progression, emploi du temps, évaluations et accès hors connexion." />
  <meta name="color-scheme" content="light" />
  <meta name="format-detection" content="telephone=no" />

  <!-- PWA iOS -->
  <meta name="theme-color" content="#faf8f5" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Mon cahier" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />

  <!-- PWA Samsung / Android -->
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
  <link rel="shortcut icon" href="/icons/favicon.ico" />

  <!-- Performance: DNS prefetch & preconnect -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />

  <!-- Polices : DM Sans (texte), Rubik (repères d'interface), Newsreader 400
       (titres de classe latins, serif éditorial à fort contraste) + repli arabe,
       display=swap. Les deux polices arabes prioritaires (Arabs Well 3 et
       Maghribi Font 3) sont servies localement depuis /public et déclarées en
       @font-face dans index.css. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400&family=Rubik:wght@400;500;600;700&display=swap" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
