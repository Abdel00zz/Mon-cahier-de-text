<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
  <title>Mon cahier de textes</title>
  <meta name="application-name" content="Mon cahier de textes" />
  <meta name="description" content="Cahier de textes enseignant avec progression, emploi du temps, évaluations et accès hors connexion." />
  <meta name="color-scheme" content="light" />
  <meta name="format-detection" content="telephone=no" />

  <!-- PWA iOS -->
  <meta name="theme-color" content="#ffffff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Mon cahier" />
  <link rel="apple-touch-icon" href="/icone.png" />

  <!-- PWA Samsung / Android -->
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Favicons -->
  <link rel="icon" type="image/png" href="/icone.png" />

  <!-- Performance: DNS prefetch & preconnect -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />

  <!-- Polices : chargement direct avec display=swap (fallback immédiat) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;700&family=Almarai:wght@400;700;800&family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700;800&family=Caveat:wght@500;700&family=Changa:wght@400;600;700&family=Fira+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Itim&family=JetBrains+Mono:wght@400;500;600&family=Kalam:wght@400;700&family=Lateef:wght@400;600;700&family=Lexend:wght@400;500;600;700&family=Marhey:wght@400;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Readex+Pro:wght@400;500;600;700&family=Roboto+Slab:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
