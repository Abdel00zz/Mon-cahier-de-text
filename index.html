<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <script>
    (function() {
      // 1. Isolate third-party browser extension errors & WebSocket proxy closures
      window.addEventListener('error', function(e) {
        if (e.filename && (e.filename.indexOf('chrome-extension://') === 0 || e.filename.indexOf('moz-extension://') === 0)) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        var msg = e.reason && (e.reason.message || String(e.reason));
        if (typeof msg === 'string' && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('closed without opened') !== -1)) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });

      // 2. Safeguard window.fetch against getter-only environments for extensions & Capacitor
      try {
        var globalObj = typeof window !== 'undefined' ? window : (typeof globalThis !== 'undefined' ? globalThis : this);
        if (globalObj) {
          var currentFetch = globalObj.fetch;
          var activeFetch = typeof currentFetch === 'function' ? currentFetch.bind(globalObj) : currentFetch;
          Object.defineProperty(globalObj, 'fetch', {
            get: function() { return activeFetch; },
            set: function(val) { activeFetch = val; },
            configurable: true,
            enumerable: true
          });
        }
      } catch (_) {
        try {
          if (typeof Window !== 'undefined' && Window.prototype) {
            var protoFetch = Window.prototype.fetch;
            var activeProtoFetch = typeof protoFetch === 'function' ? protoFetch : undefined;
            Object.defineProperty(Window.prototype, 'fetch', {
              get: function() { return activeProtoFetch; },
              set: function(val) { activeProtoFetch = val; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (__) {}
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Mon cahier de textes</title>
  <meta name="application-name" content="Mon cahier de textes" />
  <meta name="description" content="Cahier de textes enseignant avec progression, emploi du temps, évaluations et accès hors connexion." />
  <meta property="og:title" content="Mon cahier de textes" />
  <meta property="og:description" content="Cahier de textes enseignant avec progression, emploi du temps, évaluations et accès hors connexion." />
  <meta name="color-scheme" content="light" />
  <meta name="format-detection" content="telephone=no" />

  <!-- Manifeste PWA, icône d'écran d'accueil (iOS/Android) et barre système. -->
  <meta name="theme-color" content="#faf9f5" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Mon cahier de textes" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <script>
    (function() {
      try {
        var raw = localStorage.getItem('appConfig_v1');
        var locale = raw ? (JSON.parse(raw).applicationLocale || 'ar') : 'ar';
        var isAr = locale === 'ar';
        var appTitle = isAr ? 'دفتر نصوصي' : 'Mon cahier de textes';
        document.title = appTitle;
        var appMeta = document.querySelector('meta[name="application-name"]');
        if (appMeta) appMeta.setAttribute('content', appTitle);
        var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if (appleTitle) appleTitle.setAttribute('content', appTitle);
        var ogTitle = document.querySelector('meta[property="og:title"]');
        if (ogTitle) ogTitle.setAttribute('content', appTitle);
        var manifestLink = document.querySelector('link[rel="manifest"]');
        if (manifestLink) manifestLink.setAttribute('href', isAr ? '/manifest-ar.webmanifest' : '/manifest.webmanifest');
      } catch (_) {}
    })();
  </script>
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
  <link rel="shortcut icon" href="/icons/favicon.ico" />

  <!-- Google Fonts: Aref Ruqaa (titres arabes), Amiri (corps/naskh), Inter & Readex Pro (chiffres & UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Aref+Ruqaa:wght@400;700&family=Inter:wght@300..700&family=Readex+Pro:wght@300..700&display=swap" rel="stylesheet" />

  <!-- Fonts are bundled locally in styles/fonts.css, including Android/offline. -->
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/app/main.tsx"></script>
</body>
</html>
