apply plugin: 'com.android.application'

def appMetadata = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json'))
def uploadStore = System.getenv('ANDROID_UPLOAD_STORE_FILE')
def uploadPassword = System.getenv('ANDROID_UPLOAD_STORE_PASSWORD')
def uploadAlias = System.getenv('ANDROID_UPLOAD_KEY_ALIAS')
def uploadKeyPassword = System.getenv('ANDROID_UPLOAD_KEY_PASSWORD')
def hasUploadKey = uploadStore && uploadPassword && uploadAlias && uploadKeyPassword

android {
    namespace "ma.cahier.textes"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ma.cahier.textes"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appMetadata.androidVersionCode as int
        versionName appMetadata.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasUploadKey) {
            release {
                storeFile file(uploadStore)
                storePassword uploadPassword
                keyAlias uploadAlias
                keyPassword uploadKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            // Isolated emulator QA cannot overwrite the signed production app/data.
            if (project.hasProperty('notificationQa')) applicationIdSuffix '.qa'
        }
        release {
            if (hasUploadKey) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') } && !hasUploadKey) {
        throw new GradleException('Release signing missing. Run npm run android:signing or provide ANDROID_UPLOAD_* variables.')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    // Capacitor 7's compatible FCM baseline; Analytics is intentionally absent.
    implementation 'com.google.firebase:firebase-messaging:24.1.0'
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

if (file('google-services.json').exists() && !project.hasProperty('notificationQa')) {
    // Invalid supplied configuration should fail the build, rather than ship broken push.
    // The isolated .qa test application is not registered with production Firebase.
    apply plugin: 'com.google.gms.google-services'
}
