<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Planche mobile — cahier de textes</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        display: flex;
        gap: 20px;
        align-items: flex-start;
        background: #2a2622;
        font-family: "Readex Pro", system-ui, sans-serif;
        color: #efe9dd;
      }
      figure {
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      figcaption {
        font-size: 12px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #b3a696;
      }
      iframe {
        border: 0;
        border-radius: 26px;
        background: #fff;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      }
    </style>
  </head>
  <body>
    <figure>
      <figcaption>Galaxy S25 — 360 × 780</figcaption>
      <iframe src="index.html" width="360" height="780" title="Maquette 360"></iframe>
    </figure>
    <figure>
      <figcaption>iPhone 16 — 393 × 844</figcaption>
      <iframe src="index.html" width="393" height="844" title="Maquette 393"></iframe>
    </figure>
    <figure>
      <figcaption>iPhone Pro Max — 430 × 900</figcaption>
      <iframe src="index.html" width="430" height="900" title="Maquette 430"></iframe>
    </figure>
    <script>
      // Une seule largeur à la fois pour la revue : planche-mobile.html?w=393
      const only = new URLSearchParams(location.search).get("w");
      if (only) {
        document.querySelectorAll("figure").forEach((figure) => {
          const frame = figure.querySelector("iframe");
          if (frame.width !== only) figure.remove();
        });
        document.body.style.padding = "12px";
      }
    </script>
  </body>

</html>
